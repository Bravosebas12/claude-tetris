name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: claude-issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analizar issue con Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Prompt custom: no depende de que alguien mencione @claude, se dispara
          # automáticamente en cada issue nuevo o editado.
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio: "${{ github.event.issue.title }}".

            Tienes dos tareas:

            1. ETIQUETAS: revisa las labels disponibles con `gh label list` y aplica las que
               correspondan con `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`.
               Usa únicamente labels que ya existan en el repositorio (no crees labels nuevas).
               Las categorías típicas son: bug, enhancement, documentation, question,
               accessibility, duplicate, invalid, wontfix, good first issue, help wanted.

            2. DIAGNÓSTICO: inspecciona el código relevante del repositorio (game.js, index.html,
               style.css, CLAUDE.md) para entender qué parte del proyecto está implicada. Publica
               un comentario en español con:
               - Resumen del problema en una frase.
               - Causa probable, citando función/archivo concreto (ej. `collide()` en game.js).
               - Alcance estimado del cambio (pequeño / mediano / grande).
               - Enfoque sugerido para la solución, SIN implementarla todavía.

               El comentario debe estar escrito en formato Markdown válido y bien interpretable
               por GitHub: usa encabezados (`##`), listas con `-`, **negritas** para resaltar
               términos clave, y bloques de código con backticks (simples para nombres de
               función/archivo, triples ```` ``` ```` para fragmentos de código) al citar
               `collide()`, nombres de archivo u otros identificadores técnicos.

               Antes de comentar, revisa con `gh issue view ${{ github.event.issue.number }} --comments`
               si ya existe un comentario tuyo anterior que empiece con el marcador HTML
               `<!-- claude-diagnostico -->`. Si existe, actualízalo con
               `gh issue comment ${{ github.event.issue.number }} --edit-last` en vez de crear uno
               nuevo. Si no existe, crea un comentario nuevo que empiece con ese marcador para
               poder identificarlo en futuras ediciones del issue.

               Responde siempre en español.

          # Restringido a solo lectura de código + gestión de labels/comentarios de este issue.
          # Claude no puede editar archivos ni ejecutar Bash arbitrario: este workflow es
          # únicamente de diagnóstico, no de implementación.
          claude_args: |
            --allowedTools "Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue view:*),Bash(gh issue comment:*),Read,Grep,Glob"
