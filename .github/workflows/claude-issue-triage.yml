name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: claude-issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Estás analizando el issue #${{ github.event.issue.number }} de este
            repositorio (un juego de Tetris en JavaScript vanilla).

            Título: ${{ github.event.issue.title }}

            Cuerpo:
            ${{ github.event.issue.body }}

            Hacé lo siguiente:

            1. Leé `CLAUDE.md` y, según haga falta para entender el problema,
               `game.js`, `index.html` y `style.css` para ubicar qué parte de la
               arquitectura del juego está involucrada (helpers de geometría,
               mutadores de estado, renderers, el loop principal, el manejador de
               `keydown`, etc.).

            2. Elegí los labels que correspondan **únicamente** de esta lista fija
               (no crees labels nuevos, no uses otros nombres):
               bug, documentation, duplicate, enhancement, good first issue,
               help wanted, invalid, question, wontfix.
               Aplicalos con:
               gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2"
               (es seguro volver a aplicar los mismos labels si ya estaban puestos).

            3. Redactá un diagnóstico técnico general en español, en un archivo de
               texto temporal, con esta estructura:

               <!-- claude-diagnosis -->
               ## Diagnóstico de Claude

               **Resumen del problema:** ...
               **Causa probable:** ...
               **Áreas / archivos afectados:** (citá funciones y capas de
               `CLAUDE.md`, ej. `collide`, `tryRotate`, renderers, `loop`, etc.)
               **Próximos pasos sugeridos para implementar la solución:** ...

               No implementes ni propongas código todavía — este comentario es solo
               diagnóstico para planificar el fix después.

            4. Publicá ese diagnóstico como comentario. Primero intentá actualizar tu
               propio comentario anterior en este issue (si ya diagnosticaste esto
               antes, por ejemplo porque el issue fue editado):
               gh issue comment ${{ github.event.issue.number }} --edit-last --body-file <archivo>
               Si ese comando falla porque todavía no existe un comentario tuyo en
               este issue, creá uno nuevo:
               gh issue comment ${{ github.event.issue.number }} --body-file <archivo>

              No comentes ni edites ningún otro issue ni PR.
