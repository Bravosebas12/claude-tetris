name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*)"'
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio ("${{ github.event.issue.title }}").

            1. Lee el título y el cuerpo del issue.
            2. Revisa el codigo relevante del repo (game.js, index.html, style.css) para entender el contexto del problema o pedido.
            3. Asigna las labels que correspondan usando `gh issue edit ${{ github.event.issue.number }} --add-label "..."`, eligiendo unicamente entre las labels ya existentes en el repositorio (bug, documentation, duplicate, enhancement, good first issue, help wanted, invalid, question, wontfix). No crees labels nuevas.
            4. Publica un comentario en el issue con `gh issue comment ${{ github.event.issue.number }} --body "..."` que incluya un diagnostico general: resumen del problema, causa probable, archivos o funciones de game.js involucradas, y una estimacion de complejidad (baja/media/alta). No implementes la solucion todavia, solo diagnostica. El comentario debe estar escrito en formato Markdown de GitHub (encabezados, listas, bloques de codigo con backticks, etc.) para que se entienda claramente al renderizarse en la UI de GitHub.
