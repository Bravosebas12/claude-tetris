name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

# Ediciones seguidas del mismo issue no deben encolar runs redundantes.
concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Se salta los issues de bots y los que llevan @claude (esos ya los atiende claude.yml).
    if: |
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.body, '@claude') &&
      !contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # necesario para aplicar labels y comentar
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triaje y diagnóstico del issue
        id: triage
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"'
          prompt: |
            Eres el triador de issues del repositorio ${{ github.repository }}, un Tetris en JavaScript vanilla sobre HTML5 Canvas.

            Trabaja sobre el issue #${{ github.event.issue.number }}.

            ## Qué debes hacer

            1. Lee el issue: `gh issue view ${{ github.event.issue.number }} --json number,title,body,labels,author,comments`
            2. Lee el código antes de opinar. No diagnostiques de memoria ni por el título:
               - `game.js` es el núcleo (tablero, piezas, colisiones, bucle de render, puntuación).
               - `index.html` y `style.css` para temas visuales, de layout o de HUD.
               - `CLAUDE.md` describe las trampas conocidas del proyecto: léelo siempre.
            3. Aplica labels.
            4. Publica (o actualiza) el comentario de diagnóstico.

            No modifiques ningún archivo del repositorio, no hagas commits y no abras pull requests.
            Tu único objetivo es etiquetar y diagnosticar.

            ## Labels

            Usa **únicamente** estas labels, que ya existen en el repositorio. No inventes ni crees labels nuevas:

            `bug`, `enhancement`, `documentation`, `question`, `accessibility`,
            `duplicate`, `invalid`, `good first issue`, `help wanted`, `wontfix`

            Aplica entre 1 y 3, las que de verdad encajen, con:
            `gh issue edit ${{ github.event.issue.number }} --add-label "etiqueta1,etiqueta2"`

            Guías rápidas:
            - Algo que no funciona como debería → `bug`.
            - Petición de funcionalidad, cambio de comportamiento o mejora visual → `enhancement`.
            - Solo afecta a README/CLAUDE.md/comentarios → `documentation`.
            - Contraste, tamaño de texto, daltonismo, navegación por teclado → añade `accessibility`.
            - Un cambio pequeño y bien acotado en un solo sitio → añade `good first issue`.
            - Si ninguna encaja o el issue no se entiende, aplica solo `question`.

            No quites labels que ya estuvieran puestas.

            ## Diagnóstico

            Escribe el diagnóstico **en español**, empezando el cuerpo con esta línea exacta:

            <!-- claude-triage -->

            Idempotencia: antes de comentar, lista los comentarios existentes con
            `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments`
            y busca uno que contenga `<!-- claude-triage -->`.
            - Si existe, **actualízalo** con `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<ID> -f body='<texto>'`.
            - Si no existe, créalo con `gh issue comment ${{ github.event.issue.number }} --body '<texto>'`.
            Nunca dejes dos comentarios de diagnóstico en el mismo issue.
            Pasa el texto entre comillas simples; si el diagnóstico contiene una comilla simple, escápala.

            Usa exactamente estas secciones:

            ### Resumen
            Qué pide el issue, en una o dos frases.

            ### Clasificación
            Tipo (bug / mejora / duda / documentación) y severidad (baja / media / alta), con una línea de justificación.

            ### Zona del código afectada
            Rutas y funciones concretas en formato `game.js:123`, con el nombre de la función. Nada de descripciones vagas: quien implemente esto debe poder abrir el archivo por esa línea.

            ### Causa probable / estado actual
            Qué hace hoy el código y por qué produce lo que se reporta.

            ### Enfoque de solución propuesto
            Pasos concretos y ordenados. Describe el cambio, no escribas el código completo.

            ### Riesgos y efectos colaterales
            Revisa siempre si aplica alguno de estos puntos frágiles del proyecto:
            - `COLORS` y `PIECES` son arrays alineados por índice (ambos con un `null` en la posición 0). Tocar uno obliga a revisar el otro.
            - `COLS`, `ROWS` y `BLOCK` en `game.js` están duplicados con los atributos `width`/`height` del `<canvas id="board">` en `index.html`; hay que cambiarlos juntos. Lo mismo con `NB = 30` de `drawNext()` y el `#next-canvas` de 120x120.
            - Cualquier estado nuevo a nivel de módulo debe resetearse en `init()`, o se filtra de una partida a la siguiente.
            - El ciclo de vida de `requestAnimationFrame` en `endGame()`, `togglePause()` e `init()` es delicado: cambios ahí pueden dejar dos bucles de render encadenados.

            ### Verificación manual
            Cómo comprobar el arreglo en el navegador (`open index.html` o `python3 -m http.server 8000`). Este proyecto no tiene tests ni build: describe los pasos exactos a seguir en pantalla y qué debe verse.
