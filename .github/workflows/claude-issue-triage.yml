name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    # Skip bots and the action itself to avoid feedback loops
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # create/apply labels and post comments
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue *),Bash(gh label *),Bash(gh api *)"'
          prompt: |
            You are an automated issue triage assistant for this Tetris game repository.
            The codebase has three files: game.js (~300 lines, all game logic), index.html (DOM/canvas structure), and style.css (dark/retro theme).

            A GitHub issue has just been created or edited. Triage it by following these steps exactly:

            1. Read the issue:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}

            2. List existing labels:
               gh label list --repo ${{ github.repository }} --limit 100

            3. Decide which labels apply. Good labels for this project include (but are not limited to):
               - bug, enhancement, question, documentation
               - gameplay, rendering, performance, ui/ux
               - good first issue, help wanted
               Create any label that does not yet exist with a sensible hex color and description:
               gh label create "<name>" --color "<hex>" --description "<desc>" --repo ${{ github.repository }}
               Then apply all chosen labels in one command:
               gh issue edit ${{ github.event.issue.number }} --add-label "<label1>,<label2>,..." --repo ${{ github.repository }}

            4. Post a diagnostic comment (in the same language as the issue — Spanish or English):
               gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "<body>"

               The comment body must include these sections:
               **🔍 Diagnóstico automático / Automatic Triage**

               **Categoría / Category:** (bug | feature request | question | docs | etc.)

               **Resumen del problema / Problem summary:** 2-3 sentences describing the issue in plain terms.

               **Archivos probablemente afectados / Files likely involved:**
               List which of game.js, index.html, style.css are relevant and briefly why (reference specific functions from game.js when applicable: init, spawn, loop, collide, tryRotate, clearLines, draw, lockPiece, endGame).

               **Pasos sugeridos para la solución / Suggested solution steps:**
               A numbered list of high-level implementation steps that a developer can follow to fix or implement the requested change.

               **Labels aplicados / Labels applied:** list the labels you just added.

               ---
               *🤖 Este diagnóstico fue generado automáticamente por Claude. / This diagnosis was automatically generated by Claude.*

            IMPORTANT: Do NOT edit the issue body. Only add labels and post the comment.
