name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: ííøanthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (Tetris en JS vanilla, un solo `game.js`).

            Haz lo siguiente:

            1. Lee el título y cuerpo del issue con `gh issue view ${{ github.event.issue.number }}`.
            2. Revisa las labels existentes del repo con `gh label list` y elige las que apliquen (crea la label solo si no existe una adecuada y es claramente necesaria). Aplica al menos una label de tipo (`bug`, `enhancement`, `question`, `documentation`) y, si corresponde, una de prioridad (`priority: high|medium|low`) y área (`area: rendering`, `area: input`, `area: scoring`, `area: collision`, etc., según lo que toque en `game.js`, `index.html` o `style.css`).
            3. Aplica esas labels al issue con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
            4. Publica UN comentario en el issue (`gh issue comment ${{ github.event.issue.number }} --body-file -`) con un diagnóstico técnico breve que incluya:
               - Resumen de una línea del problema.
               - Causa probable, citando archivo y función/sección relevante de `game.js` cuando aplique (usa `Read`/`Grep` para confirmar antes de afirmar nada).
               - Alcance del impacto (qué se rompe o qué falta).
               - Sugerencia de enfoque de solución en alto nivel (sin implementarla todavía).
            No implementes código ni abras PRs en este workflow: solo etiqueta y diagnostica.
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*),Read,Grep,Glob"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
