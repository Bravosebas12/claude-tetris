name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (Tetris en JS vanilla, ver CLAUDE.md para arquitectura de game.js).

            1. Lee título y cuerpo del issue con `gh issue view ${{ github.event.issue.number }}`.
            2. Determina labels apropiados SOLO de este conjunto existente: bug, documentation, duplicate, enhancement, good first issue, help wanted, invalid, question, wontfix.
               Reemplaza los labels actuales del issue por los que correspondan (quita los que ya no apliquen, agrega los correctos) usando `gh issue edit ${{ github.event.issue.number }} --add-label "..." --remove-label "..."`.
            3. Publica UN comentario de diagnóstico con `gh issue comment ${{ github.event.issue.number }} --body "..."` que incluya:
               - Resumen del problema/petición en 1-2 líneas.
               - Diagnóstico técnico: qué parte de game.js está probablemente involucrada (board model, pieces/rotation, collide, wall kicks, game loop, locking/merge, clearLines/scoring, leveling, ghost piece, game over), citando función(es) por nombre.
               - Causa raíz probable o enfoque de solución sugerido, sin escribir el código todavía.
               - Si el issue no da suficiente info para diagnosticar, decirlo explícitamente y pedir los datos que faltan.
            4. No hagas cambios de código ni abras PRs. Esto es solo triage + diagnóstico.

          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"
