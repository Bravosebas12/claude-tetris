name: Claude Auto Review & Approve PR

on:
  pull_request:
    types: [opened, synchronize]
    # Solo PRs creados por Claude bot
    # Nota: Este filtro puede necesitar ajuste según tu config

permissions:
  pull-requests: write
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Review PR with Claude
        env:
          AWS_BEARER_TOKEN: ${{ secrets.AWS_BEARER_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python .github/scripts/auto-review-pr.py
