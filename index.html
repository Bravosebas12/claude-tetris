<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-switch" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section challenge-hud hidden" id="challenge-hud">
          <span class="label">DESAFÍO</span>
          <span class="value" id="challenge-level-value">1 / 5</span>
          <div class="challenge-objective">
            <span class="label" id="challenge-objective-label">Líneas: 0 / 40</span>
            <div class="progress-bar"><div class="progress-fill" id="challenge-progress-fill"></div></div>
          </div>
          <span class="label" id="challenge-timer">Tiempo: 2:00</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="save-score-section" class="save-score hidden">
          <input type="text" id="save-score-input" class="text-input" placeholder="Tu nombre" maxlength="12" autocomplete="off" />
          <button id="save-score-btn" class="btn btn-accent">Guardar</button>
        </div>
        <div id="overlay-highscores" class="highscores hidden">
          <span class="label">TOP 5</span>
          <ol id="overlay-highscores-list" class="highscores-list"></ol>
          <p id="overlay-stats" class="highscores-stats"></p>
        </div>
        <div class="overlay-actions">
          <button id="overlay-secondary-btn" class="btn hidden">Continuar</button>
          <button id="restart-btn" class="btn btn-accent">Reiniciar</button>
        </div>
      </div>
    </div>

    <div id="mode-select" class="overlay">
      <div class="overlay-box">
        <p id="mode-select-title">TETRIS</p>
        <p class="mode-select-subtitle">Elige un modo de juego</p>
        <div class="overlay-actions">
          <button id="mode-classic-btn" class="btn">Modo Clásico</button>
          <button id="mode-challenge-btn" class="btn btn-accent">Modo Desafío</button>
        </div>
        <div id="mode-select-highscores" class="highscores">
          <span class="label">TOP 5</span>
          <ol id="mode-select-highscores-list" class="highscores-list"></ol>
          <p id="mode-select-stats" class="highscores-stats"></p>
          <button id="reset-highscores-btn" class="btn btn-small">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
