<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section leaderboard-section">
          <span class="label">TOP 5</span>
          <ol id="hud-leaderboard" class="leaderboard-list"></ol>
          <div class="records-stats">
            <div class="stat-row"><span class="label">MEJOR COMBO</span><span class="value small" id="hud-best-combo">0</span></div>
            <div class="stat-row"><span class="label">LÍNEAS MÁX</span><span class="value small" id="hud-max-lines">0</span></div>
          </div>
          <button id="reset-records-btn" type="button" class="ghost-btn">Resetear records</button>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section theme-toggle">
          <span class="label">TEMA</span>
          <label class="toggle-switch" title="Cambiar tema">
            <input type="checkbox" id="theme-toggle" checked />
            <span class="toggle-slider"></span>
            <span class="toggle-icon" id="theme-icon">🌙</span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="hidden">
          <form id="name-form" class="hidden">
            <input id="name-input" maxlength="3" placeholder="AAA" autocomplete="off" />
            <button type="submit">Guardar</button>
          </form>
          <div class="leaderboard-block">
            <span class="label">TOP 5</span>
            <ol id="overlay-leaderboard" class="leaderboard-list"></ol>
          </div>
          <div class="records-stats">
            <div class="stat-row"><span class="label">MEJOR COMBO</span><span class="value small" id="overlay-best-combo">0</span></div>
            <div class="stat-row"><span class="label">LÍNEAS MÁX</span><span class="value small" id="overlay-max-lines">0</span></div>
          </div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
